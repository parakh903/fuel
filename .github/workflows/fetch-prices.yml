name: Fetch fuel prices
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-prices
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch prices and send alerts
        env:
          FUEL_API_KEY: ${{ secrets.FUEL_API_KEY }}
          FUEL_API_SECRET: ${{ secrets.FUEL_API_SECRET }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node fetch-prices.js
      - name: Commit prices.json
        run: |
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || { git commit -m "Update prices"; git pull --rebase -q; git push; }
